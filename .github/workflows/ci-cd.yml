name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow can only read repository contents.
permissions:
  contents: read

# Cancel older runs of the same branch when a new commit arrives.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # CONTINUOUS INTEGRATION (always runs)
  # ---------------------------------------------------------------
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Build image (verifies the Dockerfile works)
        run: docker build -t python-task-manager:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name tm -p 8000:8000 python-task-manager:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"
          docker logs tm
          exit 1

  # ---------------------------------------------------------------
  # OPTIONAL CONTINUOUS DEPLOYMENT (EC2)
  # Runs only when ALL of these are true:
  #   1. the tests and Docker build passed
  #   2. the event is a push to main (never on pull requests)
  #   3. the repository variable DEPLOY_ENABLED is set to "true"
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up SSH (key + pinned host key)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload application files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az --delete \
            --include='app.py' --include='requirements.txt' \
            --exclude='*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${EC2_USER}@${EC2_HOST}:/var/www/python-app/"

      - name: Install dependencies and restart service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" 'bash -s' < deploy/remote-deploy.sh

      - name: Verify the public health endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${EC2_HOST}/health"; then
              echo
              echo "Deployment verified"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after deploy"
          exit 1
